<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entangle · Capstone SiPanen</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --line:#E1E5E3; --text:#111917; --muted:#5A6561;
  --brand:#0F766E; --brand-strong:#0B5C56; --brand-weak:#E3F3F0;
  --c-done:#0D9488; --c-prog:#D97706; --c-todo:#7B8783;
  --amber:#8A4B0B; --amber-weak:#FDF0D5; --danger:#B42318;
  --side:#0E1916; --side-line:#22302C; --side-text:#C6D1CD;
  --r:10px; --shadow:0 1px 2px rgba(14,25,22,.06), 0 1px 1px rgba(14,25,22,.04);
  --mono:'Geist Mono', ui-monospace, monospace;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font:15px/1.5 'Geist', system-ui, sans-serif; display:flex; min-height:100vh}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono); font-size:13px}
.muted{color:var(--muted)}

/* sidebar */
.side{width:236px; flex-shrink:0; background:var(--side); color:var(--side-text); display:flex; flex-direction:column; gap:20px; padding:18px 12px}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px; color:#fff; font-weight:700; font-size:18px; letter-spacing:-.01em}
.proj{border:1px solid var(--side-line); border-radius:8px; padding:10px 12px}
.proj small{display:block; font-size:12px; color:#8FA09A}
.proj strong{color:#fff; font-weight:600}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; min-height:44px; padding:0 12px; border:0; border-radius:8px; background:none; color:var(--side-text); text-align:left; font-weight:500}
.nav button:hover:not(:disabled){background:#17241F; color:#fff}
.nav button[aria-current="page"]{background:#1C2C27; color:#fff}
.nav button:disabled{color:#7C8D87; cursor:default}
.nav small{font-size:11px; border:1px solid var(--side-line); border-radius:99px; padding:1px 8px}
.navrow{display:flex; gap:2px}
.nav .tog{width:44px; flex-shrink:0; justify-content:center; padding:0}
.tog svg{transition:transform .15s}
.tog[aria-expanded="false"] svg{transform:rotate(-90deg)}
/* tree line: one vertical guide for the group, a short tick per child */
.subs{display:flex; flex-direction:column; gap:2px; margin-left:22px; padding-left:10px; border-left:1px solid #3A4C46}
.nav .sub{position:relative; padding-left:12px; font-size:14px}
.nav .sub::before{content:''; position:absolute; left:-10px; top:50%; width:8px; border-top:1px solid #3A4C46}
.nav .sub small{border:0; padding:0; font-size:12px; color:#8FA09A}
.tbl-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
table{width:100%; min-width:760px; border-collapse:collapse}
th{text-align:left; font-size:12px; font-weight:600; color:var(--muted); padding:10px 16px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:14px 16px; border-bottom:1px solid var(--line); vertical-align:top; font-size:14px}
tr:last-child td{border-bottom:0}
td .link{padding:0; min-height:24px; text-align:left; font-size:15px; color:var(--text); text-decoration:none}
td .link:hover{text-decoration:underline}
.me{margin-top:auto; display:flex; align-items:center; gap:10px; padding:8px; border-top:1px solid var(--side-line)}
.me small{display:block; font-size:12px; color:#8FA09A}
.me strong{color:#fff; font-weight:600}

/* main */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px; padding:14px 28px; background:var(--surface); border-bottom:1px solid var(--line)}
.top h1{font-size:20px; font-weight:600; letter-spacing:-.01em}
.top-r{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.chip{display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border:1px solid var(--line); border-radius:99px; background:var(--surface); font-size:13px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--brand); flex-shrink:0}
.seg{display:inline-flex; padding:3px; border-radius:9px; background:#ECEFED}
.seg button{min-height:38px; padding:0 14px; border:0; border-radius:7px; background:none; font-weight:500; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.content{padding:24px 28px 48px; display:flex; flex-direction:column; gap:20px; max-width:1240px; width:100%}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-weight:600}
.btn:hover{border-color:#C4CBC8}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-strong)}
.btn.primary:disabled{background:#C9D2CF; border-color:#C9D2CF; color:#48524E; cursor:not-allowed}
.btn.ghost{border-color:transparent; background:none; color:var(--muted)}
.btn.proto{border:1.5px dashed #8A9591; background:none}
.link{background:none; border:0; padding:10px 0; color:var(--brand-strong); font-weight:600; text-decoration:underline}

.banner{display:flex; align-items:center; gap:10px; padding:12px 16px; border:1px solid #BFE1DB; background:var(--brand-weak); border-radius:var(--r)}
.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow)}
.stat b{display:block; font-size:26px; font-weight:700; letter-spacing:-.02em; line-height:1.2}
.bar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}

/* board */
.cols{display:grid; grid-template-columns:repeat(auto-fit, minmax(270px, 1fr)); gap:16px; align-items:start}
.col{background:#ECEFED; border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px}
.colh{display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:0 8px; border:0; border-radius:8px; background:none; font-size:13px; font-weight:600; text-align:left}
.colh:hover{background:#DDE3E0}
.colh .n{color:var(--muted); font-weight:500}
.colh .go{margin-left:auto; color:var(--brand-strong)}
.sdot{width:10px; height:10px; border-radius:50%; border:2px solid var(--c-todo); flex-shrink:0}
.sdot.prog{border-color:var(--c-prog); background:linear-gradient(90deg, var(--c-prog) 50%, transparent 50%)}
.sdot.done{border-color:var(--c-done); background:var(--c-done)}
/* project progress: one stacked bar, counts in the legend so colour is never the only cue */
.prog-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:16px 18px; display:flex; flex-direction:column; gap:12px}
.prog-card h2{font-size:13px; font-weight:600; color:var(--muted)}
.prog-card .hero{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px}
.prog-card .hero b{font-size:32px; font-weight:700; letter-spacing:-.02em; line-height:1}
.pbar{display:flex; gap:2px; height:12px}
.pbar span{min-width:6px; border-radius:4px}
.pbar .todo{background:var(--c-todo)} .pbar .prog{background:var(--c-prog)} .pbar .done{background:var(--c-done)}
.pbar .rest{background:#D5DBD8}
.pgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px 36px}
.pgrid > div{display:flex; flex-direction:column; gap:10px}
.legend .li{display:inline-flex; align-items:center; gap:8px; padding:4px 0; margin-right:14px; font-size:14px}
.sw{width:10px; height:10px; border-radius:3px; flex-shrink:0}
.legend{display:flex; flex-wrap:wrap; gap:4px 8px}
.legend button{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 10px; border:0; border-radius:8px; background:none; font-size:14px}
.legend button:hover{background:var(--bg)}
.legend b{font-weight:600}
.card{display:flex; flex-direction:column; gap:8px; width:100%; text-align:left; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card:hover{border-color:#B9C2BE}
.card .t{font-weight:600; font-size:15px; line-height:1.35}
.card .f{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px}
.empty{padding:18px 8px; text-align:center; font-size:13px; color:var(--muted)}
@keyframes flash{from{box-shadow:0 0 0 3px var(--brand)} to{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash 1.6s ease-out}}

.av{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:#DCE3E0; font-size:11px; font-weight:700; flex-shrink:0}
.side .av{width:32px; height:32px; background:#2A3B36; color:#fff; font-size:13px}
.tag{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid var(--line); background:var(--surface); white-space:nowrap}
.tag.open{color:var(--amber); background:var(--amber-weak); border-color:#F3D9A4}
.tag.merged{color:#fff; background:var(--brand); border-color:var(--brand)}
.tag.verified{color:var(--brand-strong); background:var(--brand-weak); border-color:#BFE1DB}
.tag.manual{color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:7px; padding:4px 10px; border-radius:99px; background:#ECEFED; font-weight:600; font-size:13px}

/* panel */
.scrim{position:fixed; inset:0; background:rgba(14,25,22,.32)}
.panel{position:fixed; top:0; right:0; bottom:0; width:min(520px, 100%); background:var(--surface); border-left:1px solid var(--line); box-shadow:-12px 0 32px rgba(14,25,22,.12); overflow-y:auto; padding:20px 24px 32px; display:flex; flex-direction:column; gap:20px}
.panel h2{font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.25}
.panel h3{font-size:13px; font-weight:600; color:var(--muted); margin-bottom:8px}
.box{border:1px solid var(--line); border-radius:var(--r); padding:14px}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.prow{display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); min-height:52px}
.prow:last-of-type{border-bottom:0}
.prow input{width:18px; height:18px; margin:3px 0 0; accent-color:var(--brand)}
.prow.taken{color:var(--muted)}
.note{font-size:13px; color:var(--amber); font-weight:500}
.hint{padding:10px 12px; border-radius:8px; background:var(--bg); font-size:14px}
.proto-box{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:12px; border:1.5px dashed #A9B3AF; border-radius:var(--r); font-size:13px; color:var(--muted)}
select.inp,input.inp,textarea.inp{width:100%; min-height:44px; padding:8px 12px; border:1px solid #C4CBC8; border-radius:8px; background:var(--surface)}
label{font-weight:600; font-size:14px}
.field{display:flex; flex-direction:column; gap:6px}
.err{color:var(--danger); font-size:13px; font-weight:500}

/* log */
.day{font-size:13px; font-weight:600; color:var(--muted); padding:4px 0}
.logbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.entry{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.ico{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:#ECEFED; color:var(--muted); flex-shrink:0}
.ico.gh{background:var(--brand); color:#fff}
.entry .b{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}

/* dialog + toast */
dialog{border:0; border-radius:14px; padding:0; width:min(480px, calc(100% - 32px)); box-shadow:0 24px 64px rgba(14,25,22,.28)}
dialog::backdrop{background:rgba(14,25,22,.4)}
dialog form{display:flex; flex-direction:column; gap:16px; padding:22px 24px}
dialog h2{font-size:18px; font-weight:700}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); display:flex; align-items:center; gap:14px; max-width:calc(100% - 32px); padding:10px 10px 10px 16px; border-radius:10px; background:var(--side); color:#fff; box-shadow:0 12px 32px rgba(14,25,22,.3)}
.toast button{min-height:36px; padding:0 12px; border:1px solid #3B4D47; border-radius:7px; background:none; color:#fff; font-weight:600}
.toast[hidden]{display:none}

@media (max-width:820px){
  body{flex-direction:column}
  .side{width:100%; flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px; padding:10px 12px}
  .proj,.me{display:none}
  .nav{flex-direction:row; flex-wrap:wrap}
  .subs{flex-direction:row; flex-wrap:wrap; margin-left:0; padding-left:6px}
  .nav .sub::before{display:none}
  .nav button{width:auto}
  .top,.content{padding-left:16px; padding-right:16px}
}
</style>
<style>
/* icon alignment */
svg{flex-shrink:0}
.il,.nav .l,.seg button,.link,.colh .go{display:inline-flex; align-items:center; gap:6px}
.nav .l{gap:10px}
.prog-card h2,.panel h3,.stat span,.day{display:flex; align-items:center; gap:6px}
.banner svg,.stat svg{color:var(--brand-strong)}
.hint{display:flex; align-items:flex-start; gap:8px}
.hint svg{margin-top:3px}
.note svg{vertical-align:-2px}
.toast button{display:inline-flex; align-items:center; gap:6px}
/* documents, settings, sharing, comments */
.tag.closed{color:var(--danger); background:#FDECEA; border-color:#F5C6C0}
.sect{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:18px 20px; display:flex; flex-direction:column; gap:12px}
.sect h2{font-size:16px; font-weight:600; display:flex; align-items:center; gap:8px}
.frow{display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px}
.frow .field{flex:1 1 200px}
.cmt{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:10px}
.cmt .rep{margin-left:18px}
.switch{display:flex; align-items:center; gap:10px; min-height:44px; font-weight:600}
.switch input{width:20px; height:20px; accent-color:var(--brand)}
.doc-body{white-space:pre-wrap; max-width:70ch}
dialog .pad{display:flex; flex-direction:column; gap:16px; padding:22px 24px}
.mlist{list-style:none; margin:0; padding:0}
.mlist li{padding:10px 0; border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
a.btn{text-decoration:none; color:inherit}
/* mentor overview: every tile and row is a button that opens its details */
button.stat{font:inherit; color:inherit; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:2px; min-height:44px}
button.stat:hover,.ov:hover{border-color:#B9C2BE}
.stat .go,.ov .go{color:var(--brand-strong); font-weight:600; font-size:13px; margin-top:6px}
.ovs{display:flex; flex-direction:column; gap:8px}
.ovh{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px}
.ovh h3{margin:0; font-size:14px}
.ov{flex-direction:row; align-items:center; gap:12px}
.ov .b{display:flex; flex-direction:column; gap:4px; flex:1; min-width:0}
.ov .go{margin:0; display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
</style>

</head>
<body>

<aside class="side">
  <div class="brand">
    <svg aria-hidden="true" width="28" height="18" viewBox="0 0 30 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="20" cy="10" r="7.5" fill="none" stroke="#2DD4BF" stroke-width="3"/></svg>
    Entangle
  </div>
  <div class="proj"><small>Project</small><strong>Capstone — SiPanen</strong></div>
  <nav class="nav" aria-label="Project navigation" id="nav"></nav>
  <div class="me" id="me"></div>
</aside>

<div class="main">
  <header class="top">
    <h1 id="title"></h1>
    <div class="top-r">
      <span class="chip" id="repo"></span>
      <span id="share-btn"></span>
      <span class="il" id="seg-wrap" style="gap:10px">
        <span class="muted" id="seg-label">View as</span>
        <span class="seg" role="group" aria-labelledby="seg-label" id="seg"></span>
      </span>
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<div id="overlay"></div>

<dialog id="dlg" aria-labelledby="dlg-h">
  <form id="form" novalidate>
    <h2 id="dlg-h">New work item</h2>
    <div class="field">
      <label for="f-title">Title</label>
      <input class="inp" id="f-title" autocomplete="off" aria-describedby="f-err">
      <span class="err" id="f-err" role="alert"></span>
    </div>
    <div class="field">
      <label for="f-desc">Description <span class="muted" style="font-weight:400">(optional)</span></label>
      <textarea class="inp" id="f-desc" rows="3"></textarea>
    </div>
    <div class="field">
      <label for="f-pic">Assignee</label>
      <select class="inp" id="f-pic"><option>Rafa</option><option selected>Enggar</option><option>Dimas</option></select>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn" data-a="dlg-close">Cancel</button>
      <button type="submit" class="btn primary" id="f-save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="share" aria-labelledby="share-h"><div class="pad" id="share-body"></div></dialog>

<div class="toast" id="toast" role="status" hidden><span id="toast-t"></span><button type="button" data-a="undo" id="toast-u">Undo</button></div>

<script>
// One shared state for board, panel, log and mentor view.
const LABEL = { todo: 'To Do', prog: 'In Progress', done: 'Done' };
const ME = 'Rafa';
const S = {
  role: 'mhs', view: 'board', filter: null, navOpen: true, open: null, picking: false, pick: null, flash: null, next: 14,
  items: [
    { id: 'ENT-13', title: 'Farmer user research', pic: 'Rafa', status: 'todo', pr: null, verified: false, desc: 'Interview 5 farmers about how they record their harvest.' },
    { id: 'ENT-12', title: 'Harvest list API', pic: 'Enggar', status: 'todo', pr: null, verified: false, desc: 'GET endpoint listing harvests per farmer.' },
    { id: 'ENT-11', title: 'Login page', pic: 'Rafa', status: 'prog', pr: 17, verified: false, desc: 'Login form with email and password.' },
    { id: 'ENT-10', title: 'Database schema design', pic: 'Dimas', status: 'done', pr: 14, verified: true, desc: 'Tables for farmers, fields and harvests.' },
    { id: 'ENT-09', title: 'Home wireframe', pic: 'Enggar', status: 'done', pr: null, verified: false, desc: 'Sketch of the farmer home screen.' },
    { id: 'ENT-08', title: 'Rent hall for farmer demo day', pic: 'Dimas', status: 'done', pr: null, verified: true, desc: 'Village hall for the demo on 5 Dec, 80 seats.',
      ev: { kind: 'Contract', name: 'hall-rental-contract.pdf', note: 'Signed by the village office.', by: 'Dimas', t: 'Yesterday 11:20', state: 'approved' } },
    { id: 'ENT-07', title: 'Buy seed samples for demo', pic: 'Enggar', status: 'prog', pr: null, verified: false, desc: 'Three seed varieties to show at the demo. Budget Rp 450.000.',
      ev: { kind: 'Receipt', name: 'receipt-seed-shop.jpg', note: 'Total Rp 412.000, under budget.', by: 'Enggar', t: 'Today 08:30', state: 'pending' } }
  ],
  prs: {
    14: { title: 'feat: database schema', author: 'Dimas', status: 'merged' },
    17: { title: 'feat: login page', author: 'Rafa', status: 'open' },
    18: { title: 'feat: harvest endpoint', author: 'Enggar', status: 'open' },
    19: { title: 'fix: form validation', author: 'Dimas', status: 'open' }
  },
  log: [
    { day: 'Today', t: '09:12', src: 'member', by: 'Rafa', item: 'ENT-11', text: 'Rafa linked PR #17 to ENT-11 · To Do → In Progress' },
    { day: 'Today', t: '08:30', src: 'member', by: 'Enggar', item: 'ENT-07', text: 'Enggar attached receipt "receipt-seed-shop.jpg" to ENT-07 · To Do → In Progress' },
    { day: 'Yesterday', t: '16:40', src: 'github', by: 'Dimas', item: 'ENT-10', text: 'Dimas merged PR #14 · ENT-10 moved to Done automatically', verified: true },
    { day: 'Yesterday', t: '15:10', src: 'member', by: 'Hafiz', item: 'ENT-11', text: 'Hafiz commented on ENT-11' },
    { day: 'Yesterday', t: '14:05', src: 'member', by: 'Enggar', item: 'ENT-09', text: 'Enggar moved ENT-09 to Done manually, without proof' },
    { day: 'Yesterday', t: '11:45', src: 'review', by: 'Hafiz', item: 'ENT-08', text: 'Hafiz approved the contract on ENT-08 · moved to Done', verified: true },
    { day: 'Yesterday', t: '11:20', src: 'member', by: 'Dimas', item: 'ENT-08', text: 'Dimas attached contract "hall-rental-contract.pdf" to ENT-08 · To Do → In Progress' }
  ],

// ---- routing: the view lives in the URL hash so each screen has its own address (Maze paths, back button) ----
function route() {
  let seg = location.hash.replace(/^#\/?/, '').split('/');
  if (seg[0] === 's') {
    const ok = S.share.on && seg[1] === S.share.token;
    S.role = 'link'; S.open = null;
    seg = seg.slice(2);
    S.view = !ok ? 'dead' : ['log', 'overview'].includes(seg[0]) ? seg[0] : 'board';
  } else {
    if (S.role === 'link') S.role = 'mhs';
    S.view = VIEWS.includes(seg[0]) ? seg[0] : 'board';
  }
  S.filter = S.view === 'board' && LABEL[seg[1]] ? seg[1] : null;
  S.docOpen = S.view === 'docs' && seg[1] ? seg[1] : null;
}

function stageProgressHtml(st, list) {

    prog: ['following a PR or proof', 'no proof, moved manually'],
    done: ['verified by proof', 'moved manually']
  }[st];

    : '<span class="pill"><span class="sdot ' + it.status + '"></span>' + LABEL[it.status] + '</span>';
  return '<div class="scrim" data-a="close"></div>' +
    '<aside class="panel" role="dialog" aria-modal="true" aria-labelledby="p-h">' +
    '<div class="row" style="justify-content:space-between"><span class="mono muted">' + it.id + '</span><span class="row">' +
    (isMhs() ? '<button type="button" class="btn ghost" data-a="edit">' + ic('edit') + 'Edit</button><button type="button" class="btn ghost" data-a="delete">' + ic('trash') + 'Delete</button>' : '') +
    '<button type="button" class="btn ghost" id="p-close" data-a="close" aria-label="Close panel">' + ic('x') + '</button></span></div>' +
    '<h2 id="p-h">' + esc(it.title) + '</h2>' +
    '<div class="row">' + statusCtl + flagTag(it) + (it.verified ? verifiedTag : '') + '<span class="row muted" style="font-size:14px">' + av(it.pic) + 'Assignee ' + esc(it.pic) + '</span></div>' +
    ((it.pr || it.ev) && isMhs() ? '<p class="muted" style="font-size:13px; margin-top:-10px">This item follows its proof, so its status is not changed manually.</p>' : '') +
    '<section><h3>' + ic('doc', 14) + 'Description</h3><p>' + (esc(it.desc) || '<span class="muted">No description.</span>') + '</p></section>' +
    '<section style="display:flex; flex-direction:column; gap:10px"><h3 style="margin:0">' + ic('clip', 14) + 'Proof of work</h3>' + prBox + '</section>' +
    docsSec + commentsHtml(it) +
    '<section><h3>' + ic('log', 14) + 'Activity for this item</h3>' + (feed.length ? '<div class="logbox">' + feed.map(entryHtml).join('') + '</div>' : '<p class="muted">No activity yet.</p>') + '</section>' +
    '</aside>';
}

function render() {
  $('nav').innerHTML =
    '<button type="button" data-a="view" data-v="overview"' + (S.view === 'overview' ? ' aria-current="page"' : '') + '><span class="l">' + ic('home') + 'Overview</span></button>' +
    // When the group is collapsed, Board itself carries the "you are here" mark for its sub pages.
    '<div class="navrow"><button type="button" data-a="view" data-v="board"' + (S.view === 'board' && (!S.filter || !S.navOpen) ? ' aria-current="page"' : '') + '><span class="l">' + ic('board') + 'Board</span></button>' +
    '<button type="button" class="tog" data-a="tog" aria-expanded="' + S.navOpen + '" aria-controls="subs" aria-label="' + (S.navOpen ? 'Collapse' : 'Expand') + ' Board sub menu">' + ic('down', 14) + '</button></div>' +
    (S.navOpen ? '<div class="subs" id="subs">' + Object.keys(LABEL).map((k) =>
      '<button type="button" class="sub" data-a="view" data-v="board" data-f="' + k + '"' + (S.view === 'board' && S.filter === k ? ' aria-current="page"' : '') + '><span class="l"><span class="sdot ' + k + '"></span>' + LABEL[k] +
      '</span><small>' + S.items.filter((i) => i.status === k).length + '</small></button>').join('') + '</div>' : '') +
    '<button type="button" data-a="view" data-v="log"' + (S.view === 'log' ? ' aria-current="page"' : '') + '><span class="l">' + ic('log') + 'Activity Log</span></button>' +
    // a share-link viewer only gets the board and the log
    (isLink() ? '' : '<button type="button" data-a="view" data-v="docs"' + (S.view === 'docs' ? ' aria-current="page"' : '') + '><span class="l">' + ic('doc') + 'Documents</span></button>' +
      '<button type="button" data-a="view" data-v="settings"' + (S.view === 'settings' ? ' aria-current="page"' : '') + '><span class="l">' + ic('settings') + 'Settings</span></button>');
  if (S.view === 'dead') $('nav').innerHTML = '';
  const who = isMhs() ? ME : isLink() ? 'Guest viewer' : 'Hafiz';
  $('me').innerHTML = av(who) + '<span><strong>' + who + '</strong><small>' + (isMhs() ? 'Student' : isLink() ? 'Shared link' : 'Mentor') + '</small></span>';
  $('repo').innerHTML = S.repo.state === 'connected'
    ? ic('repo', 14) + '<span class="mono">' + esc(S.repo.name) + '</span><span class="dot"></span>Connected'
    : ic('repo', 14) + 'No repository connected';
  $('share-btn').innerHTML = isMhs() ? '<button type="button" class="btn" data-a="share">' + ic('share') + 'Share</button>' : '';
  $('seg-wrap').style.display = isLink() ? 'none' : '';
  $('share-body').innerHTML = shareHtml();
  $('seg').innerHTML =
    '<button type="button" data-a="role" data-r="mhs" aria-pressed="' + isMhs() + '">' + ic('user', 15) + 'Student</button>' +
    '<button type="button" data-a="role" data-r="mentor" aria-pressed="' + !isMhs() + '">' + ic('eye', 15) + 'Mentor</button>';
  $('toast-u').innerHTML = ic('undo', 14) + 'Undo';
  $('f-save').innerHTML = ic('check') + 'Save';
  $('title').textContent = {
    overview: 'Overview', board: S.filter ? 'Board / ' + LABEL[S.filter] : 'Board', log: 'Activity Log',
    docs: S.docOpen ? 'Documents / ' + S.docOpen : 'Documents', settings: 'Settings', dead: 'Link not active'
  }[S.view];
  $('content').innerHTML = {
    overview: overviewHtml, board: () => (S.filter ? listHtml() : boardHtml()), log: logHtml, docs: docsHtml, settings: settingsHtml,
    dead: () => '<section class="sect"><h2>' + ic('alert') + 'This link is no longer active</h2><p class="muted">The team turned off sharing or reset the link. Ask them for a new one.</p></section>'
  }[S.view]();
  $('overlay').innerHTML = S.open ? panelHtml() : '';
  S.flash = null;
}

// ---- events ----
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  const val = (id) => $(id).value.trim();
  const fail = (errId, msg, focusId) => { $(errId).textContent = msg; $(focusId).focus(); };
  if (a === 'view') { S.open = null; go(el.dataset.v + (el.dataset.f ? '/' + el.dataset.f : '')); render(); return; } // hashchange re-renders the new view
  else if (a === 'tog') S.navOpen = !S.navOpen;
  else if (a === 'role') { S.role = el.dataset.r; S.picking = false; S.attaching = false; if (isMentor()) go('overview'); } // the overview is the mentor's home
  else if (a === 'open') { if (!item(el.dataset.id)) return; S.open = el.dataset.id; S.picking = false; S.pick = null; S.attaching = false; }
  else if (a === 'ev-new') S.attaching = true;
  else if (a === 'ev-cancel') S.attaching = false;
  else if (a === 'ev-attach') {
    const f = $('ev-file').files[0];
    if (!f) return fail('ev-err', 'Choose a file to attach', 'ev-file');
    attachEv(S.open, $('ev-kind').value, f.name, val('ev-note'));
  }
  else if (a === 'ev-sample') {
    const k = $('ev-kind').value;
    attachEv(S.open, k, { Receipt: 'receipt-print-shop.jpg', Photo: 'interview-photo.jpg', Contract: 'signed-agreement.pdf' }[k] || 'proof-document.pdf', val('ev-note'));
  }
  else if (a === 'ev-approve') approveEv(S.open);
  else if (a === 'ev-remove') removeEv(S.open);
  else if (a === 'edit') {
    const it = item(S.open);
    S.editing = it.id; $('dlg-h').textContent = 'Edit ' + it.id; $('f-err').textContent = '';
    $('f-title').value = it.title; $('f-desc').value = it.desc; $('f-pic').value = it.pic;
    $('dlg').showModal(); return;
  }
  else if (a === 'delete') deleteItem(S.open);
  else if (a === 'close-pr') closePr(S.open);
  else if (a === 'doc-open') { S.open = null; go('docs/' + el.dataset.id); render(); return; }
  else if (a === 'doc-new') { if (!val('d-title')) return fail('d-err', 'Title is required', 'd-title'); createDoc(val('d-title'), val('d-body')); }
  else if (a === 'mat-new') {
    if (!val('m-title')) return fail('m-err', 'Title is required', 'm-title');
    // only http(s) links: the value becomes an href, so other schemes must not get through
    if (!/^https?:\/\/\S+$/i.test(val('m-url'))) return fail('m-err', 'Enter a link that starts with https://', 'm-url');
    addMaterial(val('m-title'), val('m-url'));
  }
  else if (a === 'comment') { if (!val('c-new')) return $('c-new').focus(); addComment(S.open, val('c-new')); }
  else if (a === 'reply') { const rid = 'r-' + el.dataset.id; if (!val(rid)) return $(rid).focus(); addReply(Number(el.dataset.id), val(rid)); }
  else if (a === 'invite') {
    const email = val('i-email');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('i-err', 'Enter a valid email address', 'i-email');
    if (S.members.some((m) => m.email === email)) return fail('i-err', 'This person is already a member', 'i-email');
    invite(email, $('i-role').value);
  }
  else if (a === 'repo-off') { save(); S.repo.state = 'none'; toast('Repository disconnected', true); }
  else if (a === 'repo-install') S.repo.state = 'installed';
  else if (a === 'repo-on') { S.repo = { state: 'connected', name: $('repo-sel').value }; toast('Repository connected', false); }
  else if (a === 'lf-clear') { S.logMember = ''; S.logItem = ''; }
  else if (a === 'reset') { location.hash = '#/board'; location.reload(); return; }
  else if (a === 'share') { $('share').showModal(); return; }
  else if (a === 'share-close') { $('share').close(); return; }
  else if (a === 'sh-copy') {
    $('sh-url').select();
    if (navigator.clipboard) navigator.clipboard.writeText($('sh-url').value).catch(() => {}); // blocked on some file:// pages; the field stays selected for manual copy
    el.textContent = 'Copied';
    return;
  }
  // shortcut: Math.random is not a secure token, a real build issues it server-side
  else if (a === 'sh-reset') S.share.token = Math.random().toString(36).slice(2, 10);
  else if (a === 'close') S.open = null;
  else if (a === 'pick') S.picking = true;
  else if (a === 'pick-cancel') { S.picking = false; S.pick = null; }
  else if (a === 'link') { if (S.pick) linkPr(S.open, S.pick); }
  else if (a === 'unlink') unlinkPr(S.open);
  else if (a === 'merge') mergePr(S.open);
  else if (a === 'undo') { if (snap) Object.assign(S, JSON.parse(snap)); snap = null; if (!item(S.open)) S.open = null; $('toast').hidden = true; }
  else if (a === 'new') { S.editing = null; $('dlg-h').textContent = 'New work item'; $('form').reset(); $('f-err').textContent = ''; $('dlg').showModal(); return; }
  else if (a === 'dlg-close') { $('dlg').close(); return; }
  render();
  if (a === 'open') $('p-close').focus();
  if (a === 'tog') document.querySelector('.tog').focus(); // render rebuilt the nav; keep keyboard focus on the toggle
});
document.addEventListener('change', (e) => {
  if (e.target.name === 'pr') { S.pick = Number(e.target.value); render(); }
  else if (e.target.id === 'st') { setStatus(S.open, e.target.value); render(); }
  else if (e.target.id === 'lf-m') { S.logMember = e.target.value; render(); $('lf-m').focus(); }
  else if (e.target.id === 'lf-i') { S.logItem = e.target.value; render(); $('lf-i').focus(); }
  else if (e.target.id === 'sh-on') { S.share.on = e.target.checked; render(); $('sh-on').focus(); }
  else if (e.target.id === 'doc-link' && e.target.value) { linkDoc(e.target.value, S.open); render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.open && !$('dlg').open && !$('share').open) { S.open = null; render(); }
});
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const title = $('f-title').value.trim();
  if (!title) { $('f-err').textContent = 'Title is required'; $('f-title').focus(); return; }
  if (S.editing) updateItem(S.editing, title, $('f-desc').value.trim(), $('f-pic').value);
  else createItem(title, $('f-desc').value.trim(), $('f-pic').value);
  $('dlg').close();
  render();
});
// shortcut: a fresh page load has no saved state, so a share URL is trusted as active; a real build checks the token server-side
if (location.hash.indexOf('#/s/') === 0) { S.share.on = true; S.share.token = location.hash.split('/')[2] || S.share.token; }
addEventListener('hashchange', () => { route(); render(); });
route();
render();
</script>
</body>
</html>
